name: Build FindCut for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download LGPL FFmpeg build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-expanded
          $bin = Get-ChildItem ffmpeg-expanded -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)\bin\ffmpeg.exe" runtime\ffmpeg.exe
          Copy-Item "$($bin.FullName)\bin\ffprobe.exe" runtime\ffprobe.exe
          Copy-Item "$($bin.FullName)\LICENSE.txt" runtime\FFmpeg-LICENSE.txt -ErrorAction SilentlyContinue

      - name: Build application directory
        shell: pwsh
        run: .\tools\build_windows.ps1

      - name: Upload FindCut Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindCut-Windows
          path: dist/FindCut
          if-no-files-found: error
          compression-level: 9
