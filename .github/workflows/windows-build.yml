name: Build FindCut for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download LGPL FFmpeg build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          $uri = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Write-Host "Downloading FFmpeg attempt $attempt of 5"
              Invoke-WebRequest -Uri $uri -OutFile ffmpeg.zip -UseBasicParsing -TimeoutSec 120
              if ((Get-Item ffmpeg.zip).Length -gt 1000000) { $downloaded = $true; break }
            } catch { Write-Warning $_ }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $downloaded) { throw 'FFmpeg download failed after five attempts.' }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-expanded -Force
          $bin = Get-ChildItem ffmpeg-expanded -Directory | Select-Object -First 1
          Copy-Item "$($bin.FullName)\bin\ffmpeg.exe" runtime\ffmpeg.exe
          Copy-Item "$($bin.FullName)\bin\ffprobe.exe" runtime\ffprobe.exe
          Copy-Item "$($bin.FullName)\LICENSE.txt" runtime\FFmpeg-LICENSE.txt -ErrorAction SilentlyContinue
          if (-not (Test-Path runtime\ffmpeg.exe) -or -not (Test-Path runtime\ffprobe.exe)) { throw 'FFmpeg binaries were not staged.' }

      - name: Build application directory
        shell: pwsh
        run: .\tools\build_windows.ps1

      - name: Upload FindCut Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FindCut-Windows
          path: dist/FindCut
          if-no-files-found: error
          compression-level: 9
