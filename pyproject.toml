[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findcut"
version = "0.1.0"
description = "Simple, free, offline-first desktop video and audio editor"
requires-python = ">=3.11"
dependencies = ["PySide6==6.9.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
